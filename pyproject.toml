[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enochian"
version = "0.2.0"
description = "Two languages designed from first principles for AI authorship: Enochian (a safety language) and Treaty (an empty-world capability-negotiation language)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["programming-language", "compiler", "interpreter", "type-system", "capabilities", "ai"]

[project.scripts]
enochian = "enochian.cli:main"
treaty = "treaty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
