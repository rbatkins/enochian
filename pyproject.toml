[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enochian"
version = "0.1.0"
description = "A small programming language designed from first principles for AI authorship, efficiency, and minimal bugs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["programming-language", "compiler", "interpreter", "type-system", "ai"]

[project.scripts]
enochian = "enochian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
